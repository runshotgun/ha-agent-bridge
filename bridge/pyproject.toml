[project]
name = "agent-bridge"
version = "0.5.0"
description = "Keeps Claude Code and Codex CLI sessions open for Home Assistant assistants."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "aiohttp>=3.10",
  "claude-agent-sdk>=0.2.163",
  "mcp>=2.3,<3",
]

[project.scripts]
agent-bridge = "agent_bridge.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
